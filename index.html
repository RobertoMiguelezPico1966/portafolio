<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main id="game">

        <div id="map">

            <!-- CAMINOS -->
            <div class="path horizontal-main"></div>
            <div class="path diagonal-skills"></div>
            <div class="path horizontal-projects"></div>
            <div class="path diagonal-formation"></div>

            <!-- PUNTOS -->
            <div class="node start-node"></div>

            <div class="node about-node">
                <span>★</span>
                <strong>SOBRE MÍ</strong>
            </div>

            <div class="node skills-node">
                <span>⚒</span>
                <strong>HABILIDADES</strong>
            </div>

            <div class="node projects-node">
                <span>◆</span>
                <strong>PROYECTOS</strong>
            </div>

            <div class="node education-node">
                <span>★</span>
                <strong>FORMACIÓN</strong>
            </div>

            <!-- PERSONAJE -->
            <div id="player">👤</div>

        </div>

    </main>

    <script src="js/game.js"></script>

</body>
</html>
