<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main id="game">

        <div id="map">

            <!-- CAMINOS -->
            <svg class="paths" viewBox="0 0 1000 1000" preserveAspectRatio="none">

                <!-- Inicio → Sobre mí -->
                <path d="M 100 560 L 280 560"></path>

                <!-- Sobre mí → Habilidades -->
                <path d="M 280 560 C 360 560, 430 380, 550 200"></path>

                <!-- Sobre mí → Proyectos -->
                <path d="M 280 560 L 730 560"></path>

                <!-- Proyectos → Formación -->
                <path d="M 730 560 C 800 580, 840 650, 880 700"></path>

            </svg>


            <!-- PUNTOS -->
            <div class="node start-node"></div>

            <div class="node about-node">
                <span>★</span>
                <strong>SOBRE MÍ</strong>
            </div>

            <div class="node skills-node">
                <span>⚒</span>
                <strong>HABILIDADES</strong>
            </div>

            <div class="node projects-node">
                <span>◆</span>
                <strong>PROYECTOS</strong>
            </div>

            <div class="node education-node">
                <span>★</span>
                <strong>FORMACIÓN</strong>
            </div>


            <!-- PERSONAJE -->
            <div id="player">👤</div>

        </div>

    </main>

    <script src="js/game.js"></script>

</body>
</html>
