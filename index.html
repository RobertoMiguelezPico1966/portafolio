<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main id="game">

        <div id="map">

            <!-- CAMINO PRINCIPAL -->
            <svg id="paths" viewBox="0 0 1000 700" preserveAspectRatio="none">

                <path
                    d="M 100 390
                       L 280 390
                       C 330 390, 350 350, 390 315
                       L 500 210
                       L 610 100"
                    class="map-path"
                />

                <path
                    d="M 280 390
                       C 360 390, 430 410, 510 410
                       L 730 410
                       L 850 410
                       C 890 410, 900 450, 900 500"
                    class="map-path"
                />

            </svg>


            <!-- PUNTOS DEL MAPA -->

            <div class="node start-node"></div>

            <div class="node about-node">
                <span class="node-icon">★</span>
                <span class="node-name">SOBRE MÍ</span>
            </div>

            <div class="node skills-node">
                <span class="node-icon">⚒</span>
                <span class="node-name">HABILIDADES</span>
            </div>

            <div class="node projects-node">
                <span class="node-icon">◆</span>
                <span class="node-name">PROYECTOS</span>
            </div>

            <div class="node education-node">
                <span class="node-icon">★</span>
                <span class="node-name">FORMACIÓN</span>
            </div>


            <!-- PERSONAJE -->

            <div id="player">👤</div>

        </div>

    </main>

    <script src="js/game.js"></script>

</body>
</html>
