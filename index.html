<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    </head>

<body>

    <h1 id="title">Mi Portafolio</h1>

    <main id="game">

        <div id="map">

            <!-- CAMINOS -->
<svg class="paths" viewBox="0 0 1000 1000" preserveAspectRatio="none">

    <!-- Inicio → Sobre mí -->
    <path
        d="M 100 560 L 280 560"
        fill="none"
        stroke="#d8b56a"
        stroke-width="16"
        stroke-linecap="round">
    </path>

    <!-- Sobre mí → Habilidades -->
    <path
        d="M 280 560 C 360 560, 430 380, 550 200"
        fill="none"
        stroke="#d8b56a"
        stroke-width="16"
        stroke-linecap="round"
        stroke-linejoin="round">
    </path>

    <!-- Sobre mí → Proyectos -->
    <path
        d="M 280 560 L 730 560"
        fill="none"
        stroke="#d8b56a"
        stroke-width="16"
        stroke-linecap="round">
    </path>

    <!-- Proyectos → Formación -->
    <path
        d="M 730 560 C 800 580, 840 650, 880 700"
        fill="none"
        stroke="#d8b56a"
        stroke-width="16"
        stroke-linecap="round"
        stroke-linejoin="round">
    </path>

</svg>


            <!-- PUNTOS -->
            <div class="node start-node"></div>

            <div class="node about-node">
                <span>★</span>
                <strong>SOBRE MÍ</strong>
            </div>

            <div class="node skills-node">
                <span>⚒</span>
                <strong>HABILIDADES</strong>
            </div>

            <div class="node projects-node">
                <span>◆</span>
                <strong>PROYECTOS</strong>
            </div>

            <div class="node education-node">
                <span>★</span>
                <strong>FORMACIÓN</strong>
            </div>


            <!-- PERSONAJE -->
            <div id="player">👤</div>

        </div>

    </main>

    <script src="js/game.js"></script>

</body>
</html>
